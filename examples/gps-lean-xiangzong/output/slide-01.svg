<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A3F"/>
      <stop offset="100%" stop-color="#143D58"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E07A2F"/>
      <stop offset="100%" stop-color="#F0A05A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B2A3F" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0B2A3F"/>

  <rect width="1280" height="720" fill="url(#heroGrad)"/>
  <!-- atmosphere -->
  <circle cx="1080" cy="120" r="220" fill="#E07A2F" opacity="0.08"/>
  <circle cx="200" cy="620" r="180" fill="#0D8A7A" opacity="0.10"/>
  <path d="M0 520 Q320 460 640 520 T1280 500 L1280 720 L0 720 Z" fill="#081F30" opacity="0.45"/>

  <text x="80" y="96" fill="#E07A2F" font-size="18" font-weight="600" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start" opacity="1">GPS 精益管理系统</text>
  <text x="80" y="190" fill="#FFFFFF" font-size="56" font-weight="800" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start" opacity="1">筑基 →「势起」</text>
  <text x="80" y="250" fill="#D6E4EE" font-size="28" font-weight="500" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start" opacity="1">2026 下半年精益全域推进方案</text>

  <rect x="80" y="300" width="120" height="4" rx="2" ry="2" fill="#E07A2F" stroke="none" opacity="1"/>

  <text x="80" y="360" fill="#A8C5D4" font-size="18" font-weight="400" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start" opacity="1">以「453」体系框架启航精益转型</text>
  <text x="80" y="392" fill="#A8C5D4" font-size="18" font-weight="400" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start" opacity="1">锚定「真善美」价值主张 · 打造第二生产力引擎</text>

  <!-- chips -->
  <rect x="80" y="470" width="140" height="36" rx="18" ry="18" fill="rgba(255,255,255,0.08)" stroke="none" opacity="1"/>
  <text x="150" y="493" fill="#fff" font-size="14" font-weight="600" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="middle" opacity="1">四级架构</text>
  <rect x="236" y="470" width="140" height="36" rx="18" ry="18" fill="rgba(255,255,255,0.08)" stroke="none" opacity="1"/>
  <text x="306" y="493" fill="#fff" font-size="14" font-weight="600" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="middle" opacity="1">五大体系</text>
  <rect x="392" y="470" width="140" height="36" rx="18" ry="18" fill="rgba(255,255,255,0.08)" stroke="none" opacity="1"/>
  <text x="462" y="493" fill="#fff" font-size="14" font-weight="600" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="middle" opacity="1">三阶段路径</text>

  <text x="80" y="660" fill="#7FA0B4" font-size="14" font-weight="500" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start" opacity="1">汇报对象：向总</text>
  <text x="1200" y="660" fill="#7FA0B4" font-size="14" font-weight="500" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="end" opacity="1">2026 H2</text>

</svg>
