  <rect x="60" y="64" width="72" height="4" rx="2" ry="2" fill="#E07A2F" stroke="none" opacity="1"/>

  <rect x="60" y="90" width="1160" height="78" rx="12" ry="12" fill="#0B2A3F" stroke="none" opacity="1"/>
  <text x="84" y="122" fill="#E8F1F6" font-size="14" font-weight="400" font-family="DM Sans, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
<tspan x="84" dy="0">自 2025.9 起，GPS 从「探索与单点整改」迈入「体系起势与机制落地」；2026 为关键推进年，</tspan>
<tspan x="84" dy="20">以精益为「第二生产力」，用 453 框架践真善美，开启转型之旅。</tspan>
</text>

