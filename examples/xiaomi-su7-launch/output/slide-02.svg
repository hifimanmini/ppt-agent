  <text x="56" y="150" fill="#a3a3a3" font-size="15" font-weight="500" font-family="Geist Sans, Inter, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start">研发目标：做 50 万以内最好看、最好开、最智能的高品质轿车</text>

