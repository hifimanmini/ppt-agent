  <text x="56" y="692" fill="#a3a3a3" font-size="12" font-weight="500" font-family="Geist Sans, Inter, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start">小米SU7发布会</text>
