  <text x="484" y="280" fill="#FF6900" font-size="36" font-weight="800" font-family="Geist Sans, Inter, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start">好开</text>
  <text x="484" y="340" fill="#ffffff" font-size="18" font-weight="600" font-family="Geist Sans, Inter, PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" text-anchor="start">性能底盘与驾驶乐趣</text>
